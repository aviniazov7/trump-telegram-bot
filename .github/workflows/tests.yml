name: Tests

on:
  pull_request:
  push:
    branches: [main]

# No secrets and no write access: this runs on fork PRs too. Only the badge
# job below, which runs on pushes to main, gets write access.
permissions:
  contents: read

jobs:
  worker:
    name: Worker (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Secret scan (every tracked file)
        run: bash scripts/check-secrets.sh --all
      - name: Lint + typecheck
        run: npm run lint
      - name: Tests with coverage
        run: npm run coverage
      - name: Bundle check (no Cloudflare account needed)
        run: npx wrangler deploy --dry-run --outdir dist
      - name: Build badge data
        run: |
          node -e '
            const pct = require("./coverage/coverage-summary.json").total.lines.pct;
            const color = pct >= 90 ? "brightgreen" : pct >= 80 ? "green" : pct >= 70 ? "yellow" : "red";
            const badge = { schemaVersion: 1, label: "coverage", message: `${Math.floor(pct)}%`, color };
            require("fs").writeFileSync("coverage-badge.json", JSON.stringify(badge));
            console.log(badge);
          '
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: coverage-badge.json
          retention-days: 7

  # Publishes coverage-badge.json to the orphan `badges` branch, which the
  # README badge reads through shields.io. One commit, force-replaced, so
  # main's history stays clean.
  badge:
    needs: worker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/badge
      - name: Push badge branch
        run: |
          git switch --orphan badges
          cp "$RUNNER_TEMP/badge/coverage-badge.json" coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push --force origin badges
