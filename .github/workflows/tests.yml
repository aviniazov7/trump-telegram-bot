name: Tests

on:
  pull_request:
  push:
    branches: [main]

# No secrets and no write access: this runs on fork PRs too. Only the badge
# job below, which runs on pushes to main, gets write access.
permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # The bot itself is stdlib-only; coverage is a test-time tool.
      - name: Install test tools
        working-directory: legacy
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        working-directory: legacy
        run: coverage run -m unittest discover -s tests -v
      - name: Coverage report
        working-directory: legacy
        run: |
          coverage report -m | tee -a "$GITHUB_STEP_SUMMARY"
          coverage json -q -o coverage.json
      - name: Build badge data
        working-directory: legacy
        run: |
          python - <<'EOF'
          import json
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          color = "brightgreen" if pct >= 90 else "green" if pct >= 80 else "yellow" if pct >= 70 else "red"
          badge = {"schemaVersion": 1, "label": "coverage", "message": f"{pct:.0f}%", "color": color}
          json.dump(badge, open("coverage-badge.json", "w"))
          print(badge)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: legacy/coverage-badge.json
          retention-days: 7

  # Publishes coverage-badge.json to the orphan `badges` branch, which the
  # README badge reads through shields.io. The branch holds a single commit
  # that is force-replaced each time, so main's history stays clean.
  badge:
    needs: unittest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: coverage-badge
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage-badge
          path: ${{ runner.temp }}/badge
      - name: Push badge branch
        run: |
          git switch --orphan badges
          cp "$RUNNER_TEMP/badge/coverage-badge.json" coverage.json
          git add coverage.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Coverage badge for ${GITHUB_SHA::7}"
          git push --force origin badges
