name: Trump Truth Social Check

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:          # Manual trigger from GitHub UI

permissions:
  contents: write             # Needed to commit last_seen.txt updates

# Prevent overlapping runs: a hung or slow run must not race the next cron tick
# on data/last_seen.txt or push. Queue new runs instead of cancelling.
concurrency:
  group: trump-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python src/main.py

      - name: Persist last seen post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_seen.txt data/last_update_id.txt
          git diff --staged --quiet || git commit -m "🔄 Update bot state"
          git push
