name: Trump Truth Social Check

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:          # Manual trigger from GitHub UI
    inputs:
      selftest_summary:
        description: 'Send a test daily summary now (verifies the AI path)'
        type: boolean
        default: false

permissions:
  contents: write             # Needed to commit last_seen.txt updates

# Prevent overlapping runs: a hung or slow run must not race the next cron tick
# on data/last_seen.txt or push. Queue new runs instead of cancelling.
concurrency:
  group: trump-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # The AI daily summary works with no key by default (Pollinations).
          # This optional secret is only used if SUMMARY_AI_PROVIDER=gemini.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Set by the manual "Run workflow" button to send a test summary now.
          SELFTEST_SUMMARY: ${{ github.event.inputs.selftest_summary }}
        run: python src/main.py

      - name: Persist last seen post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/last_seen.txt data/last_update_id.txt data/subscribers.txt data/posts_log.txt data/last_summary_date.txt
          # Nothing changed this run — don't bother committing or pushing.
          git diff --staged --quiet && exit 0
          git commit -m "🔄 Update bot state"
          # GitHub occasionally rejects the push with a transient server-side
          # error ("remote: fatal error in commit_refs"). Retry with backoff,
          # rebasing first in case main advanced, so a blip doesn't fail the run.
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying in $((attempt * 5))s..."
            sleep $((attempt * 5))
          done
          echo "git push failed after 5 attempts" >&2
          exit 1
