name: Trump Truth Social Check

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:          # Manual trigger from GitHub UI

# Read-only: the workflow no longer commits anything. Bot state lives in the
# BOT_STATE repository variable, written with STATE_TOKEN (see README).
permissions:
  contents: read

# Prevent overlapping runs: two runs must never read-modify-write BOT_STATE at
# the same time. Queue new runs instead of cancelling.
concurrency:
  group: trump-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: only used as the last-resort translation provider, and
          # only when AI_PROVIDER=gemini.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Runtime state (subscribers, last seen post, Telegram offset) is kept
          # in the BOT_STATE repository variable, never in git. STATE_TOKEN is a
          # fine-grained PAT for this repo only, with "Variables: Read and write".
          STATE_BACKEND: github
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        run: python src/main.py
