name: Trump Truth Social Check

on:
  schedule:
    - cron: '*/10 * * * *'  # Every 10 minutes
  workflow_dispatch:          # Manual trigger from GitHub UI

# Read-only: the workflow no longer commits anything. Bot state lives in the
# BOT_STATE repository variable, written with STATE_TOKEN (see README).
permissions:
  contents: read

# Prevent overlapping runs: two runs must never read-modify-write BOT_STATE at
# the same time. Queue new runs instead of cancelling.
concurrency:
  group: trump-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Monitoring (optional): your chat ID for alerts, and a dead-man's
          # switch URL (e.g. healthchecks.io) pinged after each successful run.
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
          STALE_ALERT_MINUTES: ${{ vars.STALE_ALERT_MINUTES }}
          # No GEMINI_API_KEY on purpose: the key's free daily quota is shared
          # with the Cloudflare Worker, and this bot's throttled runs fire dozens
          # of calls at once (Oct 12: 34 in 2 minutes, 21x 429), using it up.
          # Without a key it translates with its keyless providers, which work
          # from GitHub's runners most of the time. Restore the line below only
          # if the Worker gets its own key.
          #   GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Runtime state (subscribers, last seen post, Telegram offset) is kept
          # in the BOT_STATE repository variable, never in git. STATE_TOKEN is a
          # fine-grained PAT for this repo only, with "Variables: Read and write".
          STATE_BACKEND: github
          STATE_TOKEN: ${{ secrets.STATE_TOKEN }}
        # The Python bot now lives in legacy/ until the Cloudflare Worker takes over.
        run: python legacy/src/main.py
