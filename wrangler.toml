# Cloudflare Worker for the Trump → Hebrew Telegram bot.
#
# NO SECRETS IN THIS FILE — the repository is public. Secrets are set with
#   npx wrangler secret put TELEGRAM_BOT_TOKEN        (and the others, see README)
# Locally they come from .dev.vars, which is gitignored.

name = "trump-telegram-bot"
main = "src/index.ts"
compatibility_date = "2026-09-25"
workers_dev = true

[triggers]
# Every 5 minutes. Each run stops starting new work after
# RUN_TIME_BUDGET_SECONDS, far inside the interval, so runs never overlap.
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "STATE"
# Not a secret (it's useless without account credentials). Created with
#   npx wrangler kv namespace create STATE
id = "df295f75a67a4a54aa3a2dcb8b71490a"

[vars]
# Shadow mode: posts are processed but sent ONLY to ADMIN_CHAT_ID, as a
# preview, while the legacy GitHub Actions bot keeps serving subscribers.
# Flip to "false" at cutover (see README → Cutover).
DRY_RUN = "true"
# Primary: flash-lite. On Oct 12 gemini-3.8-flash's free daily quota ran out
# (429 "per day") while flash-lite's separate quota was untouched. A model
# whose daily quota is used up is skipped until the reset (midnight Pacific).
GEMINI_MODEL = "gemini-3.5-flash-lite"
# Tried in the same run when the primary fails (and has quota left).
GEMINI_FALLBACK_MODEL = "gemini-3.8-flash"
# Applies to full models only ("lite" models are fast by default). If a model
# rejects the setting, the call is retried once without it.
GEMINI_THINKING_LEVEL = "low"
# Per call. On Oct 12 single calls took 30–40 s and ate whole runs.
GEMINI_TIMEOUT_SECONDS = "12"
# A post whose translation keeps failing is retried every run for this long,
# then sent in English (with an alert).
GEMINI_RETRY_MINUTES = "15"
# In-band "no successful run" alert. Can't be below the 30-min heartbeat
# interval (+1 min) — the code clamps it. For faster detection use
# HEALTHCHECK_URL (healthchecks.io), which costs no KV writes.
STALE_ALERT_MINUTES = "35"
SOURCE_FAILURE_ALERT_RUNS = "10"
ALERT_REPEAT_MINUTES = "60"
MAX_SCAN_POSTS = "100"
# Free plan: 50 subrequests and 10 ms CPU per cron run. Sends beyond this
# budget continue in the next run (5 min later). Raise on Workers Paid.
MAX_SUBREQUESTS = "45"
# Runs are 5 min apart, so 90 s can never overlap the next run.
RUN_TIME_BUDGET_SECONDS = "90"

[observability]
enabled = true
