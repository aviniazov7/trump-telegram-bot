# Cloudflare Worker for the Trump → Hebrew Telegram bot.
#
# NO SECRETS IN THIS FILE — the repository is public. Secrets are set with
#   npx wrangler secret put TELEGRAM_BOT_TOKEN        (and the others, see README)
# Locally they come from .dev.vars, which is gitignored.

name = "trump-telegram-bot"
main = "src/index.ts"
compatibility_date = "2026-09-25"
workers_dev = true

[triggers]
# Every 5 minutes. Each run stops starting new work after
# RUN_TIME_BUDGET_SECONDS. Cloudflare can still dispatch a second invocation
# (duplicate or retry); Coordinator is the single-flight lease.
crons = ["*/5 * * * *"]

[[kv_namespaces]]
binding = "STATE"
# Not a secret (it's useless without account credentials). Created with
#   npx wrangler kv namespace create STATE
id = "df295f75a67a4a54aa3a2dcb8b71490a"

[[durable_objects.bindings]]
name = "COORDINATOR"
class_name = "Coordinator"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Coordinator"]

[vars]
# Live since the cutover on 2026-10-12: posts go to every subscriber.
# "true" = shadow mode (previews to ADMIN_CHAT_ID only) — see README → Rollback.
DRY_RUN = "false"
# Primary: gemini-3.8-flash, for Hebrew quality. gemini-3.5-flash-lite is only
# the fallback. On Oct 12 flash's free daily quota ran out (429, limit 20)
# while flash-lite's separate quota was untouched. A model whose daily quota
# is used up is skipped until the reset (midnight Pacific), and the post
# continues on the fallback, so the bot stays inside the free tier.
GEMINI_MODEL = "gemini-3.8-flash"
# Tried in the same run when the primary fails or its free daily quota is used up.
GEMINI_FALLBACK_MODEL = "gemini-3.5-flash-lite"
# Applies to full models only ("lite" models are fast by default). If a model
# rejects the setting, the call is retried once without it.
GEMINI_THINKING_LEVEL = "low"
# Per call. On Oct 12 single calls took 30–40 s and ate whole runs.
GEMINI_TIMEOUT_SECONDS = "12"
# A post whose translation keeps failing is retried every run for this long,
# then sent in English (with an alert). An echo ("untranslated text") does
# not wait this out: Gemini is not asked again, and Workers AI is tried once.
GEMINI_RETRY_MINUTES = "15"
# Fallback translator after Gemini fails (429, errors, or an English echo).
# Free-plan multilingual instruct model. "" disables the fallback.
# Reasoning is turned off in the call so a short translation stays inside
# the 10,000 neurons/day included on Workers Free. Paid-only models are not used.
WORKERS_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
# In-band "no successful run" alert. checkHeartbeat uses the newer of the
# Durable Object heartbeat (every successful run) and meta.lastSuccess
# (at most once an hour, so idle crons do not write KV). For faster
# detection use HEALTHCHECK_URL (healthchecks.io), which costs no KV writes.
STALE_ALERT_MINUTES = "35"
SOURCE_FAILURE_ALERT_RUNS = "10"
ALERT_REPEAT_MINUTES = "60"
MAX_SCAN_POSTS = "100"
# Free plan: 50 subrequests and 10 ms CPU per cron run. Sends beyond this
# budget continue in the next run (5 min later). Raise on Workers Paid.
MAX_SUBREQUESTS = "45"
# Soft stop for starting new work. The Durable Object lease, not this budget,
# is what keeps overlapping invocations from delivering twice.
RUN_TIME_BUDGET_SECONDS = "90"

# Workers AI binding. Used only after Gemini fails. Not a secret.
# `remote` is a local-dev flag: this binding has no local simulator.
# Vitest sets remoteBindings: false and injects a fake client instead.
[ai]
binding = "AI"
remote = true

[observability]
enabled = true
